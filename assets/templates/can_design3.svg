<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
    xmlns="http://www.w3.org/2000/svg"
    width="1000"
    height="1000"
    viewBox="0 0 1000 1000">

    <g
        id="design3"
        font-family="Barlow Condensed"
        text-anchor="middle">

        <!-- PaintZ logo -->
        <text
            id="logo"
            x="500"
            y="475"
            font-size="150"
            font-weight="900"
            letter-spacing="-2"
            fill="#EFEEDC"
            stroke="#1D1F1B"
            stroke-width="3"
            stroke-opacity="0.28"
            stroke-linejoin="round"
            paint-order="stroke fill">
            Paint<tspan id="logo-z" fill="#992D26">Z</tspan>
        </text>

        <!-- Paint ID -->
        <text
            id="paint-code"
            x="500"
            y="595"
            font-size="20"
            font-weight="900"
            letter-spacing="2"
            fill="#EFEEDC"
            stroke="#1D1F1B"
            stroke-width="2"
            stroke-opacity="0.25"
            paint-order="stroke fill">
            PZ-C-UCP
        </text>

        <!-- Paint name -->
        <text
            id="paint-name"
            x="500"
            y="665"
            font-size="62"
            font-weight="900"
            letter-spacing="1"
            fill="#EFEEDC"
            stroke="#1D1F1B"
            stroke-width="2"
            stroke-opacity="0.25"
            paint-order="stroke fill">
            UCP
        </text>

        <!-- Divider -->
        <line
            id="divider"
            x1="380"
            y1="695"
            x2="620"
            y2="695"
            stroke="#EFEEDC"
            stroke-width="4"
            stroke-opacity="0.72"/>

        <!-- Information badge -->
        <rect
            id="badge"
            x="316"
            y="730"
            width="368"
            height="155"
            rx="12"
            ry="12"
            fill="#141513"
            fill-opacity="0.86"
            stroke="#E0DABF"
            stroke-width="3"
            stroke-opacity="0.62"/>

        <text
            id="series"
            x="500"
            y="775"
            font-size="34"
            font-weight="900"
            letter-spacing="2"
            fill="#EFEEDC">
            CAMO SERIES
        </text>

        <text
            id="badge-line-2"
            x="500"
            y="815"
            font-size="27"
            font-weight="600"
            letter-spacing="1.5"
            fill="#E0DABF">
            TACTICAL SURFACES
        </text>

        <text
            id="badge-line-3"
            x="500"
            y="855"
            font-size="27"
            font-weight="600"
            letter-spacing="1.5"
            fill="#E0DABF">
            FIELD PROVEN
        </text>

        <!-- Footer -->
        <text
            id="footer"
            x="500"
            y="945"
            font-size="25"
            font-weight="600"
            letter-spacing="2"
            fill="#EFEEDC"
            stroke="#1D1F1B"
            stroke-width="1.5"
            stroke-opacity="0.22"
            paint-order="stroke fill">
            SPRAY • CUSTOMIZE • SURVIVE
        </text>

    </g>
</svg>
